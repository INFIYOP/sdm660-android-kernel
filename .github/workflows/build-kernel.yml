name: build-kernel

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Deps
        # zstd and kmod are required: the defconfig enables CONFIG_MODULE_COMPRESS_ZSTD,
        # so modules_install shells out to zstd and depmod. Without them the build
        # dies with "Error 127" at the very end, after ~30 minutes of compiling.
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu flex bison bc \
            libssl-dev libelf-dev device-tree-compiler zstd kmod shellcheck

      - name: Lint scripts and run tests
        run: |
          set -euo pipefail
          bash -n scripts/*.sh
          python3 -m py_compile scripts/*.py
          shellcheck -S error scripts/*.sh android/device/generic/sdm660/shared/bin/*.sh
          bash tests/test-stage-firmware.sh

      - name: Clone kernel
        run: git clone --depth 1 --branch qcom-sdm660-7.2.y https://github.com/sdm660-mainline/linux.git linux

      - name: Apply Android feature patches
        run: |
          cd linux
          for p in ../patches/000*.patch; do git apply "$p"; done

      - name: Build kernel, DTBs and modules
        run: |
          set -euo pipefail
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          cp configs/sdm660_android_defconfig linux/arch/arm64/configs/
          cd linux
          make sdm660_android_defconfig
          make -j"$(nproc)" Image.gz modules
          make -j"$(nproc)" qcom/sdm636-xiaomi-tulip.dtb \
                            qcom/sdm636-xiaomi-whyred-tianma.dtb \
                            qcom/sdm636-xiaomi-whyred-shenchao.dtb
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp arch/arm64/boot/Image.gz "$GITHUB_WORKSPACE/out/"
          cp arch/arm64/boot/dts/qcom/sdm636-xiaomi-*.dtb "$GITHUB_WORKSPACE/out/"
          cp .config "$GITHUB_WORKSPACE/out/sdm660_android_defconfig.built"
          # Install outside out/ and drop the build/source symlinks: upload-artifact
          # follows them and would archive the whole kernel tree (2.4 GB instead of 196 MB).
          make INSTALL_MOD_PATH="$RUNNER_TEMP/modules" modules_install
          depmod -b "$RUNNER_TEMP/modules" "$(make -s kernelrelease)"
          rm -f "$RUNNER_TEMP/modules/lib/modules/"*/build "$RUNNER_TEMP/modules/lib/modules/"*/source
          tar -C "$RUNNER_TEMP" -cf "$GITHUB_WORKSPACE/out/modules.tar" modules
          cat arch/arm64/boot/Image.gz arch/arm64/boot/dts/qcom/sdm636-xiaomi-tulip.dtb \
            > "$GITHUB_WORKSPACE/out/Image.gz-dtb-tulip"

      - name: Verify device-tree module lists exist in modules.tar
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tar -xf out/modules.tar -C "$tmp"
          modroot="$(dirname "$(find "$tmp" -name modules.dep | head -1)")"
          rc=0
          for dev in tulip whyred; do
            list="android/device/generic/sdm660/$dev/modules.all"
            [ -f "$list" ] || continue
            while read -r m; do
              [ -n "$m" ] || continue
              if ! find "$modroot/kernel" \( -name "$m.ko.zst" -o -name "$m.ko" \) | grep -q .; then
                echo "::error file=$list::module '$m' required by $dev is missing from modules.tar"
                rc=1
              fi
            done < "$list"
          done
          if [ "$rc" -eq 0 ]; then echo "all modules.all entries present in modules.tar"; fi
          exit "$rc"

      - name: Checksums
        run: cd out && sha256sum Image.gz Image.gz-dtb-tulip *.dtb modules.tar sdm660_android_defconfig.built > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: out/
